version: 2.1
jobs:
  build:
    docker:
      - image: cimg/go:1.24.0
    working_directory: ~/project
    steps:
      - run:
          name: Checkout source over HTTPS
          command: |
            REPO_URL=$(echo "$CIRCLE_REPOSITORY_URL" | sed -e 's#git@github.com:#https://github.com/#')
            git clone --no-checkout "$REPO_URL" .
            git fetch origin "$CIRCLE_SHA1" --depth=1
            git checkout -qf "$CIRCLE_SHA1"
      - run: go version
      - run: GOFLAGS=-mod=vendor go build -v ./...
      - run: GOFLAGS=-mod=vendor go test -v ./...